[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-assist"
version = "0.1.0"
description = "Plateforme locale d'accompagnement DevOps avec interface graphique."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.50,<2", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devops_assist = ["data/*.json", "data/demo_repository/Dockerfile", "data/demo_repository/compose.yaml", "data/demo_repository/.gitlab-ci.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
